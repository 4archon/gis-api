<!DOCTYPE html>
<html lang="ru" style="height: 100%;">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Service</title>
        <meta name="description" content="Test 2GIS Map API" />
        <link href="/bootstrap/css/bootstrap.css" rel="stylesheet">
    </head>
    <body style="height: 80%;">
        <script src="/bootstrap/js/bootstrap.js"></script>
        <script src="/static/header/render_header.js"></script>
        <div class="container h-100">
            <div class="row justify-content-center h-100">
                <div class="col-md-5 align-self-center">
                    <div class="card">
                        <div class="card-body">
                            <form action="/2gis" method="post">
                                <div class="form-group mb-3">
                                    <label class="mb-1" for="key">Ключ 2gis:</label>
                                    <input type="text" class="form-control" id="key"
                                    placeholder="Введите ключ 2gis"
                                    value="{{ .Key}}"    
                                    name="key" />
                                </div>
                                <div class="container">
                                    <div class="row justify-content-end">
                                        <button class="btn btn-primary col-auto">
                                            Изменить
                                        </button>
                                    </div>
                              </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
